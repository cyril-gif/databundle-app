<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | AncestorData</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar"></div>

<section class="section">
  <div class="container" style="max-width:420px;">
    <h1 class="section-title">Welcome Back</h1>
    <p class="section-subtitle">Sign in to track orders and referral earnings</p>

    <div id="alertBox"></div>

    <div class="card">
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="phone" placeholder="e.g. 0541234567" maxlength="10">
      </div>
      <div class="form-group">
        <label>4-Digit PIN</label>
        <input type="password" id="pin" placeholder="••••" maxlength="4" inputmode="numeric">
      </div>
      <button class="btn btn-primary btn-block" id="loginBtn" onclick="login()">Sign In</button>
      <p class="hint" style="text-align:center; margin-top:16px;">
        Don't have an account? <a href="signup.html" style="color:var(--accent); font-weight:600;">Create one</a>
      </p>
    </div>
  </div>
</section>

<div id="footer"></div>

<script src="js/nav.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
